name: Build

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: swift test
      - name: Build Tarjem.app (universal)
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          plutil -lint build/Tarjem.app/Contents/Info.plist
          lipo -info build/Tarjem.app/Contents/MacOS/Tarjem
          codesign --verify --verbose build/Tarjem.app
      - uses: actions/upload-artifact@v4
        with:
          name: Tarjem-macOS
          path: build/Tarjem.zip
