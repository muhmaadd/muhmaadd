<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="hz:slide-selector" content=".slide">
<title>MCDC Mall — اللهم اجعل هذا البلد آمنًا</title>
<link rel="stylesheet" href="https://use.typekit.net/rae1zqb.css">
<style>
  :root {
    --teal: #003B49;
    --warmgray: #8A7967;
    --warmgray-20: #E8E4E1;
    --white: #FFFFFF;
  }
  body { margin: 0; background: #ccc; }
  .slide {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    margin: 0 0 40px 0;
    font-family: "cairo", sans-serif;
  }
  .slide * { margin: 0; padding: 0; }
  .abs { position: absolute; }
  .ar { direction: rtl; text-align: right; }
  .en { direction: ltr; text-align: left; }
  .sub { font-weight: 400; font-size: 50px; line-height: 1.4; }
  .title { font-weight: 600; font-size: 140px; line-height: 1.2; }
  .web { font-weight: 400; font-size: 30px; line-height: 1.4; }
</style>
</head>
<body>

<!-- الاتجاه 1: وقار — النظام B (خلفية تيل) -->
<section class="slide" id="direction-1" data-canvas-width="1920" data-canvas-height="1080" style="background: var(--teal);">
  <img class="abs" src="{{LOGO_REVERSE}}" alt="MCDC Mall" style="top: 96px; right: 120px; width: 300px; height: 119px;">
  <p class="abs en web" style="top: 132px; left: 120px; width: 600px; color: var(--warmgray);">mcdc-mall.com&nbsp;&nbsp;|&nbsp;&nbsp;@mcdc-mall</p>
  <div class="abs" style="top: 300px; right: 120px; width: 96px; height: 6px; background: var(--warmgray);"></div>
  <p class="abs ar sub" style="top: 320px; right: 120px; width: 1200px; color: var(--white);">المملكة العربية السعودية</p>
  <h1 class="abs ar title" style="top: 400px; right: 120px; width: 1400px; color: var(--white);">اللهم اجعل<br>هذا البلد آمنًا</h1>
  <img class="abs" src="{{DEVICE_WARMGRAY}}" alt="" style="left: 0; bottom: 0; width: 1920px; height: 308px;">
</section>

<!-- الاتجاه 2: هدوء — النظام A (لوح فاتح وشريط سفلي كما في نماذج الدليل) -->
<section class="slide" id="direction-2" data-canvas-width="1920" data-canvas-height="1080" style="background: var(--white);">
  <div class="abs" style="top: 0; left: 0; width: 1920px; height: 880px; background: var(--warmgray-20);"></div>
  <p class="abs ar sub" style="top: 150px; right: 120px; width: 1200px; color: var(--warmgray);">المملكة العربية السعودية</p>
  <h1 class="abs ar title" style="top: 230px; right: 120px; width: 1400px; color: var(--teal);">اللهم اجعل<br>هذا البلد آمنًا</h1>
  <img class="abs" src="{{DEVICE_TEAL}}" alt="" style="left: 0; top: 639px; width: 1500px; height: 241px;">
  <!-- شريط سفلي: خطوط العنصر الجرافيكي، الموقع، الشعار -->
  <div class="abs" style="left: 120px; top: 920px; width: 4px; height: 120px; background: var(--teal);"></div>
  <div class="abs" style="left: 134px; top: 920px; width: 4px; height: 120px; background: var(--teal);"></div>
  <div class="abs" style="left: 148px; top: 920px; width: 4px; height: 120px; background: var(--teal);"></div>
  <div class="abs" style="left: 162px; top: 920px; width: 4px; height: 120px; background: var(--teal);"></div>
  <div class="abs" style="left: 176px; top: 920px; width: 4px; height: 120px; background: var(--teal);"></div>
  <div class="abs" style="left: 196px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 208px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 220px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 232px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 244px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 256px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <div class="abs" style="left: 268px; top: 975px; width: 3px; height: 65px; background: var(--teal);"></div>
  <p class="abs en web" style="left: 310px; top: 958px; width: 700px; color: var(--teal);">mcdc-mall.com&nbsp;&nbsp;|&nbsp;&nbsp;@mcdc-mall</p>
  <img class="abs" src="{{LOGO_MAIN}}" alt="MCDC Mall" style="top: 929px; right: 120px; width: 260px; height: 103px;">
</section>

<!-- الاتجاه 3: أفق — تقسيم: لوح تيل بعنصر جرافيكي مكبّر، والنص على الأبيض -->
<section class="slide" id="direction-3" data-canvas-width="1920" data-canvas-height="1080" style="background: var(--white);">
  <div class="abs" style="top: 0; left: 0; width: 820px; height: 1080px; background: var(--teal);"></div>
  <img class="abs" src="{{DEVICE_CROP_WARMGRAY}}" alt="" style="left: 0; bottom: 0; width: 820px; height: 420px;">
  <img class="abs" src="{{LOGO_MAIN}}" alt="MCDC Mall" style="top: 96px; right: 120px; width: 300px; height: 119px;">
  <div class="abs" style="top: 390px; right: 120px; width: 96px; height: 6px; background: var(--warmgray);"></div>
  <p class="abs ar sub" style="top: 410px; right: 120px; width: 860px; color: var(--warmgray);">المملكة العربية السعودية</p>
  <h1 class="abs ar title" style="top: 490px; right: 120px; width: 900px; font-size: 120px; color: var(--teal);">اللهم اجعل<br>هذا البلد آمنًا</h1>
  <p class="abs en web" style="bottom: 96px; right: 120px; width: 600px; text-align: right; color: var(--warmgray);">mcdc-mall.com&nbsp;&nbsp;|&nbsp;&nbsp;@mcdc-mall</p>
</section>

</body>
</html>
